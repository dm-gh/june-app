services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: june
      POSTGRES_PASSWORD: june
      POSTGRES_DB: june
    ports:
      - "5432:5432"
    volumes:
      - june-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U june -d june"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  june-postgres:
